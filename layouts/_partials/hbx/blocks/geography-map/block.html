
{{ $block := . }}
{{ $cfg := $block.content.map | default (dict) }}
{{ $mapID := printf "geography-map-%s" ($block.id | default "main") }}

<link rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
  .geography-wrapper {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem 1rem;
    box-sizing: border-box;
  }

  .geography-title {
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 1.5rem;
  }

  .geography-canvas {
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    z-index: 0;
  }

  .leaflet-tooltip.geography-label {
    background: rgba(255, 255, 255, 0.96);
    color: #1f2937;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    font-family: system-ui, sans-serif;
    font-weight: 600;
    white-space: nowrap !important;
    max-width: none !important;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    pointer-events: none;
  }

  .leaflet-tooltip.geography-label::before {
    display: none;
  }

  .geography-popup {
    min-width: 180px;
    font-family: system-ui, sans-serif;
    line-height: 1.6;
  }

  .geography-popup-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .geography-popup-detail {
    margin: 4px 0;
  }

  @media (max-width: 640px) {
    .leaflet-tooltip.geography-label {
      white-space: normal !important;
      max-width: 170px !important;
    }
  }
</style>

<div class="geography-wrapper">

  {{ with $block.content.title }}
    <h2 class="geography-title">{{ . }}</h2>
  {{ end }}

  <div
    id="{{ $mapID }}"
    class="geography-canvas"
    style="height: {{ $cfg.height | default 520 }}px;">
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(function () {
  // Config is generated from _index.md by Hugo.
  const config = {{ $cfg }};

  const map = L.map("{{ $mapID }}", {
    scrollWheelZoom: config.scroll_wheel_zoom !== false,
    worldCopyJump: true,
    zoomControl: true
  });

  L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);

  const allMarkers = [];

  (config.markers || []).forEach(place => {
    const coords = place.coordinates;

    if (!Array.isArray(coords) || coords.length !== 2) {
      return;
    }

    // Create a point from configuration
    const marker = L.circleMarker(coords, {
      radius: place.radius ?? 9,
      color: "#ffffff",
      weight: 2,
      fillColor: place.color || "#2563eb",
      fillOpacity: 0.95
    }).addTo(map);

    // Permanent label
    if (place.name) {
      marker.bindTooltip(place.name, {
        permanent: place.show_label !== false,
        direction: place.label_position || "top",
        offset: place.label_offset || [0, -10],
        className: "geography-label",
        opacity: 1
      });
    }

    // Build popup from arbitrary detail fields
    const popup = document.createElement("div");
    popup.className = "geography-popup";

    if (place.name) {
      const heading = document.createElement("div");
      heading.className = "geography-popup-title";
      heading.textContent = place.name;
      popup.appendChild(heading);
    }

    (place.details || []).forEach(detail => {
      const line = document.createElement("div");
      line.className = "geography-popup-detail";

      if (detail.label) {
        const label = document.createElement("strong");
        label.textContent = detail.label + ": ";
        line.appendChild(label);
      }

      const value = document.createElement("span");
      value.textContent = detail.value ?? "";
      line.appendChild(value);

      popup.appendChild(line);
    });

    if (place.description) {
      const description = document.createElement("p");
      description.textContent = place.description;
      popup.appendChild(description);
    }

    marker.bindPopup(popup);
    allMarkers.push(marker);
  });

  // Initial viewport
  if (allMarkers.length && config.fit_bounds !== false) {
    const group = L.featureGroup(allMarkers);

    map.fitBounds(group.getBounds().pad(0.25), {
      maxZoom: config.max_fit_zoom ?? 4,
      padding: [20, 20]
    });
  } else {
    map.setView(
      config.center || [20, 0],
      config.zoom ?? 2
    );
  }
})();
</script>
