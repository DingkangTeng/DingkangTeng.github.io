{{ $block := . }}
{{ $lang := $block.content.lang | default "en" }}
{{ $title := $block.content.title | default "" }}
{{ $mapURL := printf "/geography/?lang=%s" $lang }}

<section id="geography" style="padding: 2rem 1rem;">
  <div style="max-width: 1100px; margin: 0 auto;">

    {{ with $title }}
    <h2 style="
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;">
      {{ . }}
    </h2>
    {{ end }}

    <iframe
      src="{{ $mapURL }}"
      title="{{ $title }}"
      loading="lazy"
      style="
        width: 100%;
        height: 480px;
        border: none;
        border-radius: 14px;"
    ></iframe>

  </div>
</section>
