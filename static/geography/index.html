
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Geography</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .leaflet-popup-content {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-width: 210px;
    }

    .school-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .school-degree {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .school-detail {
      color: #555;
      margin: 3px 0;
    }

    .leaflet-tooltip.school-label {
        background: rgba(255, 255, 255, 0.96);
        color: #1f2937;

        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 6px 12px;

        font-family: system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;

        white-space: nowrap !important;
        width: max-content !important;
        max-width: none !important;

        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        pointer-events: none;
    }

    .leaflet-tooltip.school-label::before {
        display: none;
    }

    /* Map home button styles */
    .map-home-button {
      display: block;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      background: #fff;
      color: #333;
      font-size: 23px;
      line-height: 34px;
      text-align: center;
      cursor: pointer;
    }

    .map-home-button:hover {
      background: #f4f4f4;
    }

    .map-home-button:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: -2px;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { locale, t, getSchoolText } from "./i18n.js";

    document.documentElement.lang = locale.htmlLang;
    document.title = t("pageTitle");

    // School information with bilingual support
    const schools = [
      {
        id: "hzau",
        coordinates: [30.4762, 114.3524],
        color: "#16a34a"
      },
      {
        id: "polyu",
        coordinates: [22.3045, 114.1797],
        color: "#2563eb"
      },
      {
        id: "utk",
        coordinates: [35.9517, -83.9327],
        color: "#f97316"
      }
      // Add more schools here as needed,
      // each with a unique ID, coordinates, and color for the marker
      // Must also be defined in the i18n.js file for bilingual support
    ];

    // Initialize map
    const map = L.map("map", {
      scrollWheelZoom: true,
      worldCopyJump: true,
      zoomSnap: 0,
      attributionControl: false,
      zoomControl: false
    });

    // Add zoom control with custom titles for i18n support 
    L.control.zoom({
      position: "topleft",
      zoomInTitle: t("zoomIn"),
      zoomOutTitle: t("zoomOut")
    }).addTo(map);

    // Create attribution control without the flag
    L.control.attribution({
      position: "bottomright",
      prefix: '<a href="https://leafletjs.com/" target="_blank" rel="noopener noreferrer">Leaflet</a>'
    }).addTo(map);

    async function loadBaseMap() {
      let useChinaMap = locale.mapProvider === "china";

      // Only check IP location for English pages
      if (!useChinaMap) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 2500);

        try {
          const response = await fetch("https://ipwho.is/", {
            signal: controller.signal
          });

          if (!response.ok) throw new Error("IP lookup failed");

          const data = await response.json();
          if (!data.success) throw new Error("Invalid IP result");

          useChinaMap = data.country_code === "CN";
        } catch (error) {
          console.warn("IP detection failed, using OSM:", error);
        } finally {
          clearTimeout(timer);
        }
      }

      const GEOVIS_TOKEN = "6e2c06344f8697689935f49ef3967f1e";
      const chinaCopy = t("geovisCopyright");

      // Vector street map
      const tileURL = useChinaMap
        ? `https://api.open.geovisearth.com/map/v1/vec/{z}/{x}/{y}?token=${GEOVIS_TOKEN}&tmsIds=w&format=png`
        : "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
      const streetLayer = L.tileLayer(tileURL, {
        maxZoom: 17,
        minNativeZoom: useChinaMap ? 1 : 0,
        noWrap: true,
        attribution: useChinaMap
          ? chinaCopy
          : '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      });

      // Raster map
      const rasterURL = useChinaMap
        ? `https://api.open.geovisearth.com/map/v1/img/{z}/{x}/{y}?token=${GEOVIS_TOKEN}&tmsIds=w&format=webp`
        : "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
      const satelliteLayer = L.tileLayer(
        rasterURL, {
          maxZoom: 17,
          noWrap: true,
          attribution: useChinaMap
            ? chinaCopy
            : "Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
        }
      );

      // Vector street map is the default layer
      streetLayer.addTo(map);

      // Set up layer control with bilingual labels
      const baseMaps = {
        [t("streetMap")]: streetLayer,
        [t("satellite")]: satelliteLayer
      };

      L.control.layers(baseMaps, null, {
        position: "topright",
        collapsed: false
      }).addTo(map);
    }

    loadBaseMap();

    const markers = [];

    schools.forEach((school, index) => {
      const info = getSchoolText(school.id);

      const marker = L.circleMarker(school.coordinates, {
        radius: 9,
        color: "#ffffff",
        weight: 2,
        fillColor: school.color,
        fillOpacity: 0.95
      }).addTo(map);

      // Permanent university labels
        const labelPositions = [
            { direction: "top", offset: [0, -10] },
            { direction: "bottom", offset: [0, 10] },
            { direction: "right", offset: [12, 0] }
        ];

        marker.bindTooltip(info.name, {
            permanent: true,
            direction: labelPositions[index].direction,
            offset: labelPositions[index].offset,
            className: "school-label",
            opacity: 1
        });

      // Build bilingual popup
      const popup = document.createElement("div");

      const title = document.createElement("div");
      title.className = "school-title";
      title.textContent = info.name;

      const degree = document.createElement("div");
      degree.className = "school-degree";
      degree.textContent = info.degree;

      const location = document.createElement("div");
      location.className = "school-detail";
      location.textContent = `${t("location")}: ${info.location}`;

      const period = document.createElement("div");
      period.className = "school-detail";
      period.textContent = `${t("period")}: ${info.period}`;

      popup.append(title, degree, location, period);

      marker.bindPopup(popup);
      markers.push(marker);
    });

    // Reset map view to default position and zoom level
    function resetMapView() {
      map.invalidateSize({ pan: false });

      const mapWidth = map.getSize().x;
      const zoom = Math.log2(mapWidth * 1.03 / 256);

      map.closePopup();
      map.setView([29, 0], zoom, { animate: false });
    }

    // Add a custom control button to reset the map view
    const homeControl = L.control({
      position: "topleft"
    });

    homeControl.onAdd = function () {
      const container = L.DomUtil.create(
        "div",
        "leaflet-bar leaflet-control"
      );

      const button = L.DomUtil.create(
        "button",
        "map-home-button",
        container
      );

      button.type = "button";
      button.innerHTML = "&#8962;";
      button.title = t("resetView");
      button.setAttribute("aria-label", button.title);

      // Disable click and scroll propagation to prevent map interactions when clicking the button
      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.disableScrollPropagation(container);

      button.addEventListener("click", resetMapView);

      return container;
    };

    homeControl.addTo(map);

    // Initialize the map view to the default position and zoom level
    resetMapView();
  </script>
</body>
</html>
