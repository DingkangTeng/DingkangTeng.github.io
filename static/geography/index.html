
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My Geography</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .leaflet-popup-content {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-width: 210px;
    }

    .school-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .school-degree {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .school-detail {
      color: #555;
      margin: 3px 0;
    }

    .leaflet-tooltip.school-label {
        background: rgba(255, 255, 255, 0.96);
        color: #1f2937;

        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 6px 12px;

        font-family: system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;

        white-space: nowrap !important;
        width: max-content !important;
        max-width: none !important;

        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        pointer-events: none;
    }

    .leaflet-tooltip.school-label::before {
        display: none;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Detect language from URL
    const params = new URLSearchParams(window.location.search);
    const lang = params.get("lang") === "zh" ? "zh" : "en";

    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";

    const labels = {
      en: {
        location: "Location",
        period: "Period"
      },
      zh: {
        location: "地点",
        period: "时间"
      }
    };

    // University locations and bilingual descriptions
    const schools = [
      {
        coordinates: [30.4762, 114.3524],
        color: "#16a34a",
        period: "2015–2019",
        en: {
          name: "Huazhong Agricultural University",
          degree: "B.A. in Land Resource Management",
          location: "Wuhan, China"
        },
        zh: {
          name: "华中农业大学",
          degree: "土地资源管理 · 管理学学士",
          location: "中国武汉"
        }
      },

      {
        coordinates: [22.3045, 114.1797],
        color: "#2563eb",
        period: "2024–2026",
        en: {
          name: "The Hong Kong Polytechnic University",
          degree: "MSc in Urban Informatics and Smart Cities",
          location: "Hong Kong, China"
        },
        zh: {
          name: "香港理工大学",
          degree: "城市信息学及智慧城市 · 理学硕士",
          location: "中国香港"
        }
      },

      {
        coordinates: [35.9517, -83.9327],
        color: "#f97316",
        period: "2026–Present",
        periodZh: "2026–至今",
        en: {
          name: "University of Tennessee, Knoxville",
          degree: "PhD in Geography",
          location: "Knoxville, Tennessee, USA"
        },
        zh: {
          name: "田纳西大学诺克斯维尔分校",
          degree: "地理学博士",
          location: "美国田纳西州诺克斯维尔"
        }
      }
    ];

    // Initialize map
    const map = L.map("map", {
      scrollWheelZoom: true,
      worldCopyJump: true,
      zoomSnap: 0,
      attributionControl: false
    });

    // Create attribution control without the flag
    L.control.attribution({
      position: "bottomright",
      prefix: '<a href="https://leafletjs.com/" target="_blank" rel="noopener noreferrer">Leaflet</a>'
    }).addTo(map);

    // L.tileLayer(
    //   "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    //   {
    //     maxZoom: 17,
    //     noWrap: true,
    //     attribution: "&copy; OpenStreetMap contributors"
    //   }
    // ).addTo(map);

    async function loadBaseMap() {
      let useChinaMap = lang === "zh";

      // Only check IP location for English pages
      if (!useChinaMap) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 2500);

        try {
          const response = await fetch("https://ipwho.is/", {
            signal: controller.signal
          });

          if (!response.ok) throw new Error("IP lookup failed");

          const data = await response.json();
          if (!data.success) throw new Error("Invalid IP result");

          useChinaMap = data.country_code === "CN";
        } catch (error) {
          console.warn("IP detection failed, using OSM:", error);
        } finally {
          clearTimeout(timer);
        }
      }

      const GEOVIS_TOKEN = "6e2c06344f8697689935f49ef3967f1e";
      const tileURL = useChinaMap
        ? `https://api.open.geovisearth.com/map/v1/vec/{z}/{x}/{y}?token=${GEOVIS_TOKEN}&tmsIds=w&format=png`
        : "https://tile.openstreetmap.org/{z}/{x}/{y}.png";

      L.tileLayer(tileURL, {
        maxZoom: 17,
        minNativeZoom: useChinaMap ? 1 : 0,
        noWrap: true,
        attribution: useChinaMap
          ? lang == "zh" ? "&copy; 中科星图" : "&copy; Geovisearth"
          : "&copy; OpenStreetMap contributors"
      }).addTo(map);
    }

    loadBaseMap();

    const markers = [];

    schools.forEach((school, index) => {
      const info = school[lang];

      const marker = L.circleMarker(school.coordinates, {
        radius: 9,
        color: "#ffffff",
        weight: 2,
        fillColor: school.color,
        fillOpacity: 0.95
      }).addTo(map);

      // Permanent university labels
        const labelPositions = [
            { direction: "top", offset: [0, -10] },
            { direction: "bottom", offset: [0, 10] },
            { direction: "right", offset: [12, 0] }
        ];

        marker.bindTooltip(info.name, {
            permanent: true,
            direction: labelPositions[index].direction,
            offset: labelPositions[index].offset,
            className: "school-label",
            opacity: 1
        });

      // Build bilingual popup
      const popup = document.createElement("div");

      const title = document.createElement("div");
      title.className = "school-title";
      title.textContent = info.name;

      const degree = document.createElement("div");
      degree.className = "school-degree";
      degree.textContent = info.degree;

      const location = document.createElement("div");
      location.className = "school-detail";
      location.textContent =
        `${labels[lang].location}: ${info.location}`;

      const period = document.createElement("div");
      period.className = "school-detail";
      period.textContent =
        `${labels[lang].period}: ${
          lang === "zh" && school.periodZh
            ? school.periodZh
            : school.period
        }`;

      popup.append(title, degree, location, period);

      marker.bindPopup(popup);
      markers.push(marker);
    });

    // Center the world map and fit its width
    const mapWidth = map.getSize().x;
    const zoom = Math.log2(mapWidth * 1.03 / 256);

    map.setView([29, 0], zoom);
  </script>
</body>
</html>
